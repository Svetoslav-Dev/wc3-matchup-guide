name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Run web build
        run: npm run build

      - name: Run typecheck
        run: npm run typecheck

      - name: Run mobile typecheck
        run: npm run mobile:typecheck

      - name: Run Expo web export
        run: npm run mobile:export

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wc3_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wc3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wc3_test
      JWT_SECRET: integration-test-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify test database target
        run: |
          case "$DATABASE_URL" in
            *"@127.0.0.1:"*|*"@localhost:"*) ;;
            *)
              echo "Refusing to run integration tests against a non-local database target."
              exit 1
              ;;
          esac

      - name: Run database migrations
        run: npm run db:migrate

      - name: Seed test database
        run: npm run db:seed

      - name: Run integration tests
        run: npm run test:integration
