name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Run web build
        run: npm run build

      - name: Run typecheck
        run: npm run typecheck

      - name: Run mobile typecheck
        run: npm run mobile:typecheck

      - name: Run Expo web export
        run: npm run mobile:export
